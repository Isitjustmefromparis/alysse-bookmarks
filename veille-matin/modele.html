<!-- Modèle du mail du matin.
     Styles en ligne uniquement : Gmail supprime les <style> et le <head>.
     Dupliquer le bloc ITEM autant de fois que nécessaire (4 en général).
     Palette : vert forêt #36592F, vert très foncé #213B1C, orange #E48C3C,
     crème #EFE7D2, sauge #CDCD8A. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EFE7D2;margin:0;padding:24px 12px;font-family:Georgia,'Times New Roman',serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#FFFDF7;border:1px solid #DCD3B8;">

        <!-- EN-TÊTE -->
        <tr>
          <td style="background:#36592F;padding:20px 26px;">
            <div style="color:#EFE7D2;font-size:19px;letter-spacing:0.04em;">Matière du matin</div>
            <div style="color:#CDCD8A;font-size:13px;padding-top:5px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;">DATE_DU_JOUR</div>
          </td>
        </tr>

        <!-- ITEM (à dupliquer) -->
        <tr>
          <td style="padding:24px 26px 4px 26px;">
            <div style="font-size:11px;letter-spacing:0.11em;text-transform:uppercase;color:#E48C3C;font-family:-apple-system,'Segoe UI',Arial,sans-serif;">NOM_DU_PROJET_OU_SERENDIPITE</div>
            <div style="font-size:18px;color:#213B1C;padding-top:7px;line-height:1.3;">TITRE_DE_L_ITEM</div>
            <div style="font-size:15px;color:#3B3A33;line-height:1.62;padding-top:10px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;">
              CORPS_3_A_5_PHRASES
            </div>
            <div style="padding-top:9px;font-size:13px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;">
              <a href="URL_SOURCE" style="color:#36592F;">NOM_DE_LA_SOURCE</a>
            </div>
          </td>
        </tr>
        <tr><td style="padding:18px 26px 0 26px;"><div style="border-top:1px solid #E6DEC6;font-size:0;line-height:0;">&nbsp;</div></td></tr>
        <!-- FIN ITEM -->

        <!-- PIED -->
        <tr>
          <td style="padding:20px 26px 24px 26px;">
            <div style="font-size:12px;color:#8A8674;line-height:1.55;font-family:-apple-system,'Segoe UI',Arial,sans-serif;">
              Sujets tirés de <span style="color:#36592F;">veille-matin/sujets.md</span>.
              Pour changer ce qui arrive ici, éditer ce fichier.
            </div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
